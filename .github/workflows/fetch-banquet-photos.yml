name: Fetch banquet photos (one-time)

# Copies photos that only live in Cloudflare R2 (uploaded from admin.html)
# into this side branch so they can be used for the banquet video.
# Runs only on pushes to banquet-assets. Never touches main or the site.

on:
  push:
    branches: [banquet-assets]
    paths: [".github/workflows/fetch-banquet-photos.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from the Worker
        env:
          W: https://inglemoor-scores.grahamcomley.workers.dev
        run: |
          set -e
          mkdir -p banquet/2026-09-05 banquet/2026-09-11
          for g in 2026-09-05 2026-09-11; do
            curl -fsS "$W/?action=list&game=$g" > banquet/$g/list.json
            python3 - "$g" <<'PY'
          import json, sys
          g = sys.argv[1]
          d = json.load(open(f"banquet/{g}/list.json"))
          open(f"banquet/{g}/keys.txt", "w").write("\n".join(f["key"] for f in d.get("files", [])) + "\n")
          print(g, len(d.get("files", [])), "files")
          PY
            while read -r k; do
              [ -z "$k" ] && continue
              curl -fsS -o "banquet/$g/$(basename "$k")" "$W/?action=img&key=$k"
            done < banquet/$g/keys.txt
          done
          curl -fsS -o banquet/hero.jpg "$W/?action=img&key=hero/current.jpg" || echo "no hero"
          ls -la banquet/*
      - name: Commit to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banquet/
          git commit -m "Banquet: photos copied from R2" || echo "nothing new"
          git push
