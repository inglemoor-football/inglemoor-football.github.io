name: Refresh calendar

# Pulls the public Google Calendar and commits data/events.json.
# Runs on a schedule, and you can also trigger it by hand from the
# Actions tab with "Run workflow".

on:
  schedule:
    # Hourly at :17. Not :00 — that is the busiest slot and GitHub
    # can delay scheduled runs by up to 15 minutes under load.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the calendar
        run: python scripts/fetch_calendar.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update calendar"
          git push
