name: Refresh calendar

# Pulls the public Google Calendar and commits data/events.json.
# Runs on a schedule, and you can also trigger it by hand from the
# Actions tab with "Run workflow".

on:
  schedule:
    # 06:10, 12:10 and 18:10 Pacific (UTC is 7 or 8 hours ahead)
    - cron: "10 13 * * *"
    - cron: "10 19 * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the calendar
        run: python scripts/fetch_calendar.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update calendar"
          git push
